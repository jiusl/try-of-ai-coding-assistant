<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Try — AI 编程助手</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- ============================================ -->
  <!-- 侧边栏 -->
  <!-- ============================================ -->
  <aside id="sidebar">
    <div class="sidebar-header">
      <h1 class="logo">🤖 Try</h1>
      <button id="btn-new-session" class="btn-icon" title="新建会话">＋</button>
    </div>

    <!-- Agent 选择 -->
    <div class="sidebar-section">
      <label class="sidebar-label">Agent</label>
      <select id="agent-select" class="agent-select">
        <option value="builtin:chat">💬 Chat</option>
        <option value="builtin:builder">🔨 Builder</option>
      </select>
    </div>

    <!-- 会话列表 -->
    <div class="sidebar-section sidebar-section-grow">
      <label class="sidebar-label">会话历史</label>
      <input type="text" id="session-search" class="session-search" placeholder="搜索会话…">
      <div id="session-list" class="session-list">
        <div class="session-item-loading">加载中...</div>
      </div>
    </div>

    <!-- 底部信息 -->
    <div class="sidebar-footer">
      <span id="status-indicator" class="status-dot offline"></span>
      <span id="status-text">就绪</span>
    </div>
  </aside>

  <!-- ============================================ -->
  <!-- 设置面板 (右侧滑出) -->
  <!-- ============================================ -->
  <div id="settings-overlay" class="settings-overlay" style="display:none"></div>
  <aside id="settings-panel" class="settings-panel">
    <div class="settings-header">
      <h2>⚙️ 设置</h2>
      <button id="btn-settings-close" class="btn-icon" title="关闭">✕</button>
    </div>

    <div class="settings-body">
      <!-- 模型配置 -->
      <div class="settings-section">
        <h3 class="settings-section-title">模型配置</h3>

        <label class="settings-label">Provider</label>
        <select id="settings-provider" class="settings-select">
          <option value="openai">OpenAI</option>
          <option value="anthropic">Anthropic</option>
          <option value="deepseek">DeepSeek</option>
          <option value="ollama">Ollama (本地)</option>
        </select>

        <label class="settings-label">模型</label>
        <div class="model-input-wrapper">
          <input type="text" id="settings-model" class="settings-input"
            placeholder="输入模型名称或点击选择…" autocomplete="off">
          <button type="button" id="btn-model-dropdown" class="model-dropdown-btn" title="常用模型">▾</button>
          <div id="model-dropdown" class="model-dropdown" style="display:none">
            <!-- 由 JS 动态填充 -->
          </div>
        </div>

        <label class="settings-label">Temperature <span id="settings-temp-val" class="settings-range-val">0.7</span></label>
        <input type="range" id="settings-temperature" class="settings-range" min="0" max="2" step="0.05" value="0.7">

        <label class="settings-label">Max Tokens</label>
        <input type="number" id="settings-max-tokens" class="settings-input" min="64" max="131072" value="4096">
      </div>

      <!-- API Keys -->
      <div class="settings-section">
        <h3 class="settings-section-title">API 密钥</h3>
        <p class="settings-hint">密钥以脱敏方式存储，留空则保持原值不变</p>

        <div id="settings-providers-keys">
          <!-- 动态插入 -->
        </div>
      </div>
    </div>

    <div class="settings-footer">
      <button id="btn-settings-reset" class="btn-ghost">取消</button>
      <button id="btn-settings-save" class="btn-primary">保存设置</button>
    </div>
  </aside>

  <!-- ============================================ -->
  <!-- 主聊天区域 -->
  <!-- ============================================ -->
  <main id="main">
    <!-- 顶部栏 -->
    <header id="chat-header">
      <button id="btn-toggle-sidebar" class="btn-icon" title="切换侧边栏">☰</button>
      <span id="current-session-title" class="session-title">新会话</span>
      <div class="header-actions">
        <button id="btn-settings" class="btn-icon" title="设置">⚙️</button>
        <button id="btn-clear-chat" class="btn-sm" title="清空对话">清空</button>
      </div>
    </header>

    <!-- 消息列表 -->
    <div id="message-list" class="message-list">
      <div class="welcome-message">
        <div class="welcome-icon">🤖</div>
        <h2>欢迎使用 Try</h2>
        <p>AI 驱动的编程助手，帮助你编码、调试和重构。</p>
        <div class="quick-actions">
          <button class="quick-btn" data-prompt="帮我分析这个项目的结构">📂 分析项目</button>
          <button class="quick-btn" data-prompt="帮我解释这段代码的作用">💡 解释代码</button>
          <button class="quick-btn" data-prompt="帮我写一个函数">✏️ 编写代码</button>
          <button class="quick-btn" data-prompt="帮我审查代码中的问题">🔍 代码审查</button>
        </div>
      </div>
    </div>

    <!-- 输入区域 -->
    <div id="input-area" class="input-area">
      <div class="input-container">
        <textarea
          id="chat-input"
          placeholder="输入消息... (Enter 发送, Shift+Enter 换行)"
          rows="1"
        ></textarea>
        <button id="btn-send" class="btn-send" title="发送">
          <span class="send-icon">➤</span>
        </button>
        <button id="btn-stop" class="btn-stop" title="停止生成" style="display:none">
          <span class="stop-icon">■</span>
        </button>
      </div>
      <div class="input-footer">
        <span class="input-hint">Enter 发送 · Shift+Enter 换行 · Tab 切换 Agent</span>
        <span id="char-count" class="char-count">0</span>
      </div>
    </div>
  </main>

  <script src="/app.js"></script>
</body>
</html>
